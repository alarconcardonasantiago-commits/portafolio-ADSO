version: '3.8'

services:
  portfolio:
    build: .
    container_name: portafolio-adso
    restart: always
    ports:
      - "8080:80"
    networks:
      - web-network

  # Cloudflare Quick Tunnel (trycloudflare) para despliegue local sin cuenta
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    command: tunnel --url http://portfolio:80
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
